[project]
name = "edt-platform"
version = "0.1.0"
description = "Enterprise Design Thinking AI Platform — autonomous, multi-agent Design Thinking lifecycle (Discover → Define → Ideate → Prototype → Validate)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "EDT Platform Team" }]
keywords = ["agents", "design-thinking", "multi-agent", "claude", "langgraph", "mcp", "a2a", "rag"]

dependencies = [
  # --- Agent runtime / LLM ---
  "anthropic>=0.40.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  # --- Durable workflow ---
  "temporalio>=1.7.0",
  # --- API ---
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "sse-starlette>=2.1.0",
  # --- Data / stores ---
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  # --- Reporting ---
  "reportlab>=4.2.0",
  "redis>=5.1.0",
  "qdrant-client>=1.12.0",
  "neo4j>=5.25.0",
  "boto3>=1.35.0",
  # --- Eventing ---
  "aiokafka>=0.11.0",
  "cloudevents>=1.11.0",
  # --- MCP / tools ---
  "mcp>=1.1.0",
  "httpx>=0.27.0",
  # --- RAG / embeddings ---
  "voyageai>=0.3.0",
  "rank-bm25>=0.2.2",
  # --- Observability / security ---
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.0",
  "langfuse>=2.53.0",
  "presidio-analyzer>=2.2.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.12.0",
  "deepeval>=1.4.0",
  "ragas>=0.2.0",
]

[project.scripts]
edt = "edt_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edt_platform"]
# Ship non-Python assets (the dashboard SPA served by the control plane).
artifacts = ["src/edt_platform/api/dashboard.html"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# str+Enum is an intentional, Pydantic-friendly pattern used across schemas.
ignore = ["UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
