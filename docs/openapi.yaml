openapi: 3.1.0
info:
  title: EDT Platform Control Plane API
  description: >
    Control-plane REST API for the Enterprise Design Thinking AI Platform (edt_platform).
    Manages projects, runs (the Design Thinking lifecycle), artifacts, human-approval gates,
    events/streaming, agents, evaluations, and semantic memory queries.
    See docs/12-api-specification.md, docs/03-workflow.md, docs/13-data-model.md,
    docs/14-event-model.md.
  version: 1.0.0
  contact:
    name: EDT Platform
    url: https://edt.example.com
  license:
    name: Proprietary

servers:
  - url: https://api.edt.example.com
    description: Production

security:
  - oidc: [runs:read]

tags:
  - name: projects
  - name: runs
  - name: artifacts
  - name: approvals
  - name: events
  - name: agents
  - name: evaluations
  - name: memory

paths:
  # ---------------------------------------------------------------- projects
  /v1/projects:
    get:
      tags: [projects]
      summary: List projects
      operationId: listProjects
      security: [{ oidc: [runs:read] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [projects]
      summary: Create project
      operationId: createProject
      security: [{ oidc: [admin] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/projects/{project_id}:
    get:
      tags: [projects]
      summary: Get project
      operationId: getProject
      security: [{ oidc: [runs:read] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/projects/{project_id}/runs:
    post:
      tags: [runs]
      summary: Start a run
      operationId: startRun
      security: [{ oidc: [runs:write] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRunRequest' }
      responses:
        '201':
          description: Run started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------------- runs
  /v1/runs:
    get:
      tags: [runs]
      summary: List runs
      operationId: listRuns
      security: [{ oidc: [runs:read] }]
      parameters:
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/RunState' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated runs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Run' }

  /v1/runs/{run_id}:
    get:
      tags: [runs]
      summary: Get run
      operationId: getRun
      security: [{ oidc: [runs:read] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/runs/{run_id}/cancel:
    post:
      tags: [runs]
      summary: Cancel a run
      operationId: cancelRun
      security: [{ oidc: [runs:write] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/runs/{run_id}/phases:
    get:
      tags: [runs]
      summary: List phases of a run
      operationId: listPhases
      security: [{ oidc: [runs:read] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Phase' }

  # --------------------------------------------------------------- artifacts
  /v1/runs/{run_id}/artifacts:
    get:
      tags: [artifacts]
      summary: List artifacts of a run
      operationId: listRunArtifacts
      security: [{ oidc: [artifacts:read] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: type
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Artifact' }

  /v1/artifacts/{artifact_id}:
    get:
      tags: [artifacts]
      summary: Get artifact (latest version)
      operationId: getArtifact
      security: [{ oidc: [artifacts:read] }]
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/artifacts/{artifact_id}/versions:
    get:
      tags: [artifacts]
      summary: List artifact versions
      operationId: listArtifactVersions
      security: [{ oidc: [artifacts:read] }]
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArtifactVersion' }

  # --------------------------------------------------------------- approvals
  /v1/approvals:
    get:
      tags: [approvals]
      summary: List approvals
      operationId: listApprovals
      security: [{ oidc: [approvals:read] }]
      parameters:
        - name: decision
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Approval' }

  /v1/runs/{run_id}/approvals:
    get:
      tags: [approvals]
      summary: List approvals for a run
      operationId: listRunApprovals
      security: [{ oidc: [approvals:read] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Approval' }

  /v1/approvals/{approval_id}/approve:
    post:
      tags: [approvals]
      summary: Approve a gate
      operationId: approveApproval
      security: [{ oidc: [approvals:write] }]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/approvals/{approval_id}/reject:
    post:
      tags: [approvals]
      summary: Reject a gate
      operationId: rejectApproval
      security: [{ oidc: [approvals:write] }]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '409': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ events
  /v1/runs/{run_id}/events:
    get:
      tags: [events]
      summary: List persisted events for a run
      operationId: listRunEvents
      security: [{ oidc: [runs:read] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: type
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CloudEvent' }

  /v1/runs/{run_id}/stream:
    get:
      tags: [events]
      summary: Live run progress (Server-Sent Events)
      operationId: streamRun
      security: [{ oidc: [runs:read] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: since
          in: query
          description: Resume from this run event sequence
          schema: { type: integer }
      responses:
        '200':
          description: SSE stream of CloudEvent data blocks
          content:
            text/event-stream:
              schema: { type: string }

  # ------------------------------------------------------------------ agents
  /v1/agents:
    get:
      tags: [agents]
      summary: List registered agents
      operationId: listAgents
      security: [{ oidc: [agents:read] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }

  /v1/agents/{agent_id}:
    get:
      tags: [agents]
      summary: Get agent and its A2A Agent Card
      operationId: getAgent
      security: [{ oidc: [agents:read] }]
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '404': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------- evaluations
  /v1/evaluations:
    get:
      tags: [evaluations]
      summary: List evaluation results
      operationId: listEvaluations
      security: [{ oidc: [evaluations:read] }]
      parameters:
        - name: subject_kind
          in: query
          schema: { type: string, enum: [artifact, agent_execution, run] }
        - name: subject_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/EvaluationResult' }

  # ----------------------------------------------------------------- memory
  /v1/memory/query:
    post:
      tags: [memory]
      summary: Semantic memory query
      operationId: queryMemory
      security: [{ oidc: [memory:query] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryQueryRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryQueryResponse' }

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://id.edt.example.com/realms/edt/.well-known/openid-configuration

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string }
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            validation:
              value:
                error:
                  type: https://errors.edt/validation
                  code: validation_error
                  message: confidence_threshold must be between 0 and 1
                  status: 422
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736

  schemas:
    RunState:
      type: string
      enum: [created, planning, discover, awaiting_approval, define, ideate,
             prototype, validate, generating_deliverables, completed, failed, cancelled]

    Page:
      type: object
      properties:
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    Project:
      type: object
      required: [id, org_id, name, business_problem]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        business_problem: { type: string }
        status: { type: string, default: active }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    CreateProjectRequest:
      type: object
      required: [name, business_problem]
      properties:
        name: { type: string }
        business_problem: { type: string }
        metadata: { type: object, additionalProperties: true }

    StartRunRequest:
      type: object
      required: [business_problem]
      properties:
        business_problem: { type: string }
        confidence_threshold: { type: number, minimum: 0, maximum: 1, default: 0.7 }
        budget_usd_cap: { type: number }
        options:
          type: object
          properties:
            auto_approve_gates: { type: boolean, default: false }
            reuse_memory: { type: boolean, default: true }

    Run:
      type: object
      required: [run_id, project_id, state]
      properties:
        run_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/RunState' }
        pending_gate: { type: [string, "null"] }
        confidence_threshold: { type: number }
        budget_usd_cap: { type: [number, "null"] }
        cost_usd_spent: { type: number }
        temporal_workflow_id: { type: [string, "null"] }
        phases:
          type: array
          items: { $ref: '#/components/schemas/Phase' }
        created_at: { type: string, format: date-time }

    Phase:
      type: object
      properties:
        name: { type: string }
        seq: { type: integer }
        status: { type: string, enum: [pending, running, completed, failed] }
        avg_confidence: { type: [number, "null"] }

    Artifact:
      type: object
      required: [id, run_id, type, version]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        phase: { type: string }
        type: { type: string }
        title: { type: [string, "null"] }
        version: { type: integer }
        producer_agent: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        provenance: { type: object, additionalProperties: true }
        s3_uri: { type: [string, "null"] }
        status: { type: string, enum: [draft, approved, superseded] }
        content: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    ArtifactVersion:
      type: object
      properties:
        artifact_id: { type: string, format: uuid }
        version: { type: integer }
        content_hash: { type: string }
        content: { type: object, additionalProperties: true }
        s3_uri: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    Approval:
      type: object
      required: [id, run_id, gate_id, decision]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        artifact_id: { type: [string, "null"], format: uuid }
        gate_id: { type: string, enum: [gate_1, gate_2, gate_3, gate_4, gate_5, gate_6] }
        decision: { type: string, enum: [pending, approved, rejected] }
        decided_by: { type: [string, "null"] }
        comments: { type: [string, "null"] }
        requested_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }

    ApprovalDecisionRequest:
      type: object
      properties:
        comments: { type: string }

    CloudEvent:
      type: object
      required: [specversion, id, source, type, time]
      properties:
        specversion: { type: string, enum: ["1.0"] }
        id: { type: string }
        source: { type: string }
        type: { type: string }
        subject: { type: string }
        time: { type: string, format: date-time }
        datacontenttype: { type: string }
        dataschema: { type: string }
        orgid: { type: string }
        runid: { type: string }
        traceid: { type: string }
        data: { type: object, additionalProperties: true }

    Agent:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [supervisor, phase, worker, cross_cutting] }
        model_tier: { type: string }
        agent_card: { type: object, additionalProperties: true }

    EvaluationResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject_kind: { type: string, enum: [artifact, agent_execution, run] }
        subject_id: { type: string, format: uuid }
        evaluator: { type: string, enum: [promptfoo, deepeval, ragas, llm_judge, human] }
        metric: { type: string }
        score: { type: number }
        passed: { type: boolean }
        detail: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    MemoryQueryRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        layer: { type: string, enum: [working, episodic, semantic, procedural, graph], default: semantic }
        collection: { type: string, enum: [edt_insights, edt_personas, edt_artifacts, edt_ideas, edt_knowledge] }
        top_k: { type: integer, minimum: 1, maximum: 50, default: 5 }
        filter: { type: object, additionalProperties: true }

    MemoryQueryResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              subject_id: { type: string }
              text: { type: string }
              score: { type: number }
              run_id: { type: string }
              phase: { type: string }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          properties:
            type: { type: string }
            code: { type: string }
            message: { type: string }
            status: { type: integer }
            trace_id: { type: string }
            details:
              type: array
              items:
                type: object
                additionalProperties: true
