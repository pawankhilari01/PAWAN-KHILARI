name: pages

# Publishes the browser demo (web/) to GitHub Pages so the dashboard is hosted
# from this repository — openable from any browser, no server required.
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that, this workflow deploys on every push to
# the default branch (and on manual dispatch).

on:
  push:
    branches: [main, master]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
