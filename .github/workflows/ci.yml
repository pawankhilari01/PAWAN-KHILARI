name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type check (mypy)
        run: mypy src || true   # advisory until fully typed
      - name: Unit + smoke tests
        run: pytest -q

  prompt-eval:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: promptfoo prompt regression gate
        run: |
          npx --yes promptfoo@latest eval -c prompts/**/**.yaml --no-cache || \
            echo "promptfoo requires ANTHROPIC_API_KEY; gate is enforced in the private eval workflow"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  build-image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -f deploy/docker/Dockerfile -t edt-platform:${{ github.sha }} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: edt-platform:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"   # set to 1 to hard-fail on findings
