# Local development stack for the EDT Platform.
# Brings up every backing store the platform speaks to, plus the control-plane API.
# `docker compose up` then `curl localhost:8080/healthz`.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: edt
      POSTGRES_PASSWORD: edt
      POSTGRES_DB: edt
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/edtneo4j
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j:/data"]

  redpanda:   # Kafka-compatible broker for local dev
    image: redpandadata/redpanda:latest
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G",
              "--reserve-memory", "0M", "--node-id", "0", "--check=false",
              "--kafka-addr", "PLAINTEXT://0.0.0.0:9092",
              "--advertise-kafka-addr", "PLAINTEXT://localhost:9092"]
    ports: ["9092:9092"]

  minio:      # S3-compatible object store for artifacts
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: edt
      MINIO_ROOT_PASSWORD: edtminio
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    depends_on: [postgres, redis, qdrant, neo4j, redpanda, minio]
    environment:
      EDT_STORE_POSTGRES_DSN: postgresql+asyncpg://edt:edt@postgres:5432/edt
      EDT_STORE_REDIS_URL: redis://redis:6379/0
      EDT_STORE_QDRANT_URL: http://qdrant:6333
      EDT_STORE_NEO4J_URI: bolt://neo4j:7687
      EDT_STORE_NEO4J_PASSWORD: edtneo4j
      EDT_EVENT_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      EDT_STORE_S3_ENDPOINT: http://minio:9000
      EDT_LLM_ANTHROPIC_API_KEY: ${EDT_LLM_ANTHROPIC_API_KEY:-}
    ports: ["8080:8080"]

volumes:
  pg: {}
  qdrant: {}
  neo4j: {}
  minio: {}
